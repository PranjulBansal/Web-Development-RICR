<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
    crossorigin="anonymous"
  />
  <body>
    <div
      class="container-fluid h-75 w-25 my-5 border border-2 border-black shadow"
    >
      <div class="form">
        <h2 class="text-center mt-4">Age Calculator</h2>
        <h4 class="text-center mt-5 fw-bold">Enter Your Date of Birth</h4>
        <div
          class="label border border-3 border-black h-25 w-75 mt-3 d-grid mx-auto"
        >
          <input type="date" name="currentDate" id="yourDate" />
        </div>
        <h4 class="text-center mt-5 fw-bold">Current Date</h4>
        <div
          class="label border border-3 border-black h-25 w-75 mt-3 d-grid mx-auto"
        >
          <input type="date" name="currentDate" id="currentDate" />
        </div>
        <div class="text-center">
          <button class="btn btn-dark mt-5 mb-4 fs-5" onclick="calculate()">
            Calculate Age
          </button>
        </div>
        <div class="text-center mb-4">
          <span id="age" class="fs-5 text-success fw-bold"></span>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
    <script src="index.js"></script>
  </body>
</html>
