<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <div class="container">
        <div class="head">

        <div >

        </div>

        </div>
      </div>
      <div id="first">
        <div id="box1"></div>
        <div id="box2"></div> 
        <div id="box3"></div>
        <div id="box4"></div>
      </div>
       <div id="second">
        <div id="secondbox1"></div>
        <div id="secondbox2"></div>
        <div id="secondbox3"></div>
        <div id="secondbox4"></div>
      </div>
       <div id="third">
        <div >
            <input id="thirdbox" type="text">
            <button id="submit1" disabled>Submit</button>
        </div>
        <div >
            <p id="p1">Score:50</p>
        </div>
        <div >
            <p id="p2">Click Start Game to Begin</p>
        </div>
        </div>
      
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
